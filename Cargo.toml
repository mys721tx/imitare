[package]
name = "imitare"
description = "a fake file generator"
license = "GPL-3.0-or-later"
repository = "https://github.com/mys721tx/imitare"
version = "0.2.0"
authors = ["Yishen Miao <mys721tx@gmail.com>"]
edition = "2024"

[dependencies]
getrandom = { version = "0.4.1", features = ["sys_rng"] }
rand_core = "0.10.0"
clap = { version = "4.5.60", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive", "strum_macros"] }
strum_macros = "0.28.0"

[dev-dependencies]
tempfile = "3.26.0"
chacha20 = { version = "0.10.0", features = ["rng"] }
